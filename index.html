<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meteo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Meteo</h1>
    <form id="search">
      <input id="city" placeholder="City name" autocomplete="off" required>
      <button>Search</button>
    </form>
  </header>

  <main>
    <p id="status">Search for a city to see the weather.</p>
    <section id="current" hidden></section>
    <section id="forecast" hidden></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
